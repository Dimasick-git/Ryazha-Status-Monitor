version: '3.8'

services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/build
      - ./output:/output
    working_dir: /build
    command: make switch
    environment:
      - DEVKITPRO=/opt/devkitpro
  
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/build
    working_dir: /build
    command: make test || echo "No tests configured"
    environment:
      - DEVKITPRO=/opt/devkitpro
  
  release:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    volumes:
      - ./releases:/output
    command: ["cp", "*.nro", "*.elf", "*.json", "/output/"]
    
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/build
      - ./dev-output:/output
    working_dir: /build
    command: /bin/bash
    environment:
      - DEVKITPRO=/opt/devkitpro
    stdin_open: true
    tty: true
