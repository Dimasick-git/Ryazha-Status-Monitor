name: Ryazha-Status-Monitor CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: yesimnathan/switchdev:latest
    strategy:
      matrix:
        include:
          - compiler: devkitA64
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup devkitPro environment
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH
          
      - name: Install dependencies
        run: |
          echo "Dependencies already installed in yesimnathan/switchdev image"
          
      - name: Build
        run: |
          make
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ryazha-status-monitor-${{ matrix.compiler }}
          path: |
            *.ovl
            *.elf
            *.json
            
      - name: Create Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.ovl
            README.md
          generate_release_notes: true

  test:
    runs-on: ubuntu-latest
    container: yesimnathan/switchdev:latest
    needs: build
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup devkitPro environment
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH
          
      - name: Install dependencies
        run: |
          echo "Dependencies already installed in yesimnathan/switchdev image"
          
      - name: Run tests
        run: |
          make test || echo "No tests configured yet"
          
      - name: Performance benchmarks
        run: |
          make benchmark || echo "No benchmarks configured yet"

  monitor:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Collect metrics
        run: |
          echo "Collecting build metrics..."
          echo "Build completed successfully"
          
      - name: Update dashboard
        run: |
          echo "Dashboard update placeholder"
