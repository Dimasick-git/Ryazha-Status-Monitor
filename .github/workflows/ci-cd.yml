name: Ryazha-Status-Monitor CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  release:
    types:
      - published

# ─── Глобальные переменные ───────────────────────────────────────────────────
env:
  DEVKITPRO:  /opt/devkitpro
  DEVKITA64:  /opt/devkitpro/devkitA64
  ARTIFACT_NAME: ryazha-status-monitor
  IMAGE_TAG:  devkitpro/devkita64:20251231   # фиксированный тег!

# ─── Отмена старых запусков при новом пуше ───────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE_TAG }}             # фиксированный контейнер
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # PATH пробрасывается через GITHUB_PATH — не через echo PATH=...
      - name: Configure environment
        run: echo "$DEVKITA64/bin" >> $GITHUB_PATH

      # Убеждаемся, что тулчейн реально доступен
      - name: Verify toolchain
        run: |
          which aarch64-none-elf-gcc
          aarch64-none-elf-gcc --version

      - name: Build
        run: make -j"$(nproc)"

      # Защита от пустых архивов
      - name: Verify artifacts
        run: |
          test -n "$(find . -maxdepth 1 \
            \( -name '*.ovl' -o -name '*.elf' -o -name '*.json' \) \
            -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 14
          if-no-files-found: error   # падает, если нечего грузить
          path: |
            *.ovl
            *.elf
            *.json

# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ${{ env.IMAGE_TAG }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: echo "$DEVKITA64/bin" >> $GITHUB_PATH

      # Условный запуск — не падает, если цели нет в Makefile
      - name: Run tests
        run: make -n test >/dev/null 2>&1 && make test || echo "No tests"

      - name: Run benchmarks
        run: make -n benchmark >/dev/null 2>&1 && make benchmark || echo "No benchmarks"

# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'release'
    permissions:
      contents: write                # нужен write для загрузки в релиз

    steps:
      # Скачиваем артефакт из build-job, не пересобираем
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - uses: softprops/action-gh-release@v2   # v2 — актуальная версия
        with:
          generate_release_notes: true
          files: |
            *.ovl
            *.elf
            *.json

# ─────────────────────────────────────────────────────────────────────────────
  monitor:
    name: Monitor
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      # Отчёт прямо в GitHub UI (вкладка Summary)
      - name: Generate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## CI/CD Status
          | Параметр | Значение              |
          |----------|-----------------------|
          | Branch   | `${{ github.ref_name }}` |
          | Commit   | `${{ github.sha }}`   |
          | Run ID   | `${{ github.run_id }}` |
          | Status   | ✅ Build + Test passed |
          EOF
