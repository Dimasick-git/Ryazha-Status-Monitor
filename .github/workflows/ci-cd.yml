name: Ryazha-Status-Monitor CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Minimal devkitA64 container
    container:
      image: devkitpro/devkita64:20251231

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fix PATH for devkitA64
      - name: Set devkitPro PATH
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> $GITHUB_ENV
          echo "PATH=/opt/devkitpro/devkitA64/bin:$PATH" >> $GITHUB_ENV
          
      - name: Install dependencies
        run: |
          echo "Dependencies already installed in devkitpro/devkita64 container"
          
      - name: Build
        run: |
          make
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ryazha-status-monitor-${{ matrix.compiler }}
          path: |
            *.ovl
            *.elf
            *.json
            
      - name: Create Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.ovl
            README.md
          generate_release_notes: true

  test:
    runs-on: ubuntu-latest
    needs: build

    # Minimal devkitA64 container
    container:
      image: devkitpro/devkita64:20251231

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fix PATH for devkitA64
      - name: Set devkitPro PATH
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> $GITHUB_ENV
          echo "PATH=/opt/devkitpro/devkitA64/bin:$PATH" >> $GITHUB_ENV
          
      - name: Install dependencies
        run: |
          echo "Dependencies already installed in devkitpro/devkita64 container"
          
      - name: Run tests
        run: |
          make test || echo "No tests configured yet"
          
      - name: Performance benchmarks
        run: |
          make benchmark || echo "No benchmarks configured yet"

  monitor:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Collect metrics
        run: |
          echo "Collecting build metrics..."
          echo "Build completed successfully"
          
      - name: Update dashboard
        run: |
          echo "Dashboard update placeholder"
