name: Ryazha-Status-Monitor CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  release:
    types:
      - published

env:
  DEVKITPRO:     /opt/devkitpro
  DEVKITA64:     /opt/devkitpro/devkitA64
  ARTIFACT_NAME: ryazha-status-monitor

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.DEVKIT_IMAGE }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure environment
        run: echo "$DEVKITA64/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          which aarch64-none-elf-gcc
          aarch64-none-elf-gcc --version

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify artifacts
        run: |
          test -n "$(find . -maxdepth 1 \
            \( -name '*.ovl' -o -name '*.elf' -o -name '*.json' \) \
            -print -quit)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 14
          if-no-files-found: error
          path: |
            *.ovl
            *.elf
            *.json

# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ${{ vars.DEVKIT_IMAGE }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure environment
        run: echo "$DEVKITA64/bin" >> $GITHUB_PATH

      - name: Run tests
        run: make -n test >/dev/null 2>&1 && make test || echo "No tests configured"

      - name: Run benchmarks
        run: make -n benchmark >/dev/null 2>&1 && make benchmark || echo "No benchmarks configured"

# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Verify downloaded files
        run: ls -lah

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.ovl
            *.elf
            *.json

# ─────────────────────────────────────────────────────────────────────────────
  monitor:
    name: Monitor
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Generate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## CI/CD Status
          | Параметр | Значение                      |
          |----------|-------------------------------|
          | Branch   | `${{ github.ref_name }}`      |
          | Commit   | `${{ github.sha }}`           |
          | Run ID   | `${{ github.run_id }}`        |
          | Status   | ✅ Build + Test passed        |
          EOF
