name: Version Release Automation

on:
  push:
    branches: [ main ]
    paths:
      - Makefile
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-on-version-change:
    runs-on: ubuntu-latest

    # Minimal devkitA64 container
    container:
      image: devkitpro/devkita64:20251231

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect APP_VERSION changes
        id: version_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_version=$(git show "$before":Makefile | sed -nE 's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([0-9]+(\.[0-9]+)*).*/\1/p' | head -n1)
          new_version=$(sed -nE 's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([0-9]+(\.[0-9]+)*).*/\1/p' Makefile | head -n1)

          echo "old=$old_version"
          echo "new=$new_version"

          if [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Python
        if: steps.version_check.outputs.changed == 'true'
        run: |
          set -e
          v=$(sed -nE 's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([0-9]+(\.[0-9]+)*).*/\1/p' Makefile | head -n1)
          tag="v${v}"

          prev_tag=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${tag}$" | head -n1 || true)
          if [ -n "$prev_tag" ]; then
            changes=$(git log --pretty=format:'- %s' "${prev_tag}..HEAD")
          else
            changes=$(git log --pretty=format:'- %s')
          fi

          {
            echo "# Ryazha Status Monitor ${v}"
            echo
            echo "## Описание релиза"
            echo
            echo "Автоматический релиз версии ${v}."
            echo
            echo "## Изменения"
            echo
            if [ -n "$changes" ]; then
              echo "$changes"
            else
              echo "- Изменения отсутствуют."
            fi
            echo
            echo "## Техническая информация"
            echo
            echo "- Версия: ${v}"
            echo "- Коммит: ${GITHUB_SHA}"
            if [ -n "$prev_tag" ]; then
              echo "- Предыдущий тег: ${prev_tag}"
            else
              echo "- Предыдущий тег: отсутствует"
            fi
            echo
          } > release-notes.md

      - name: Get version
        if: steps.version_check.outputs.changed == 'true'
        id: version
        run: |
          v=$(sed -nE 's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([0-9]+(\.[0-9]+)*).*/\1/p' Makefile | head -n1)
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build project
        if: steps.version_check.outputs.changed == 'true'
        run: make

      - name: Check if release tag already exists
        if: steps.version_check.outputs.changed == 'true'
        id: tag_check
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Warning: Tag $tag already exists, skipping release creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version_check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          VERSION="${{ steps.version.outputs.value }}"
          git tag -a "v$VERSION" -m "Release version $VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        if: steps.version_check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Ryazha-Status-Monitor v${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: |
            Ryazha-Status-Monitor.ovl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
