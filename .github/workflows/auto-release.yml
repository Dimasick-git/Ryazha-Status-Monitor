name: Version Release Automation

on:
  push:
    branches: [ main ]
    paths:
      - Makefile
      - scripts/generate_release_notes.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-on-version-change:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect APP_VERSION changes
        id: version_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_version=$(git show "$before":Makefile | sed -nE 's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([^#[:space:]]+).*/\1/p' | head -n1)
          new_version=$(sed -nE 's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([^#[:space:]]+).*/\1/p' Makefile | head -n1)

          echo "old=$old_version"
          echo "new=$new_version"

          if [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Python
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate release notes (AI + fallback)
        if: steps.version_check.outputs.changed == 'true'
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          python3 scripts/generate_release_notes.py release-notes.md

      - name: Get version
        if: steps.version_check.outputs.changed == 'true'
        id: version
        run: |
          v=$(sed -nE 's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([^#[:space:]]+).*/\1/p' Makefile | head -n1)
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Setup devkitPro environment
        if: steps.version_check.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git python3 python3-pip
          wget https://github.com/devkitPro/pacman/releases/download/v2.1.1/devkitpro-pacman-installer.tar.gz
          tar -xzvf devkitpro-pacman-installer.tar.gz
          sudo ./devkitpro-pacman-installer.sh --no-confirm
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S switch-devkitA64 switch-tools switch-libnx switch-mesa switch-glad switch-libdrm_nouveau switch-curl switch-libjpeg-turbo switch-libpng switch-zlib switch-bz2 switch-libogg switch-libvorbis switch-libmpg123 switch-opusfile switch-ffmpeg --noconfirm

      - name: Build project
        if: steps.version_check.outputs.changed == 'true'
        run: make

      - name: Check if release tag already exists
        if: steps.version_check.outputs.changed == 'true'
        id: tag_check
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version_check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Ryazha-Status-Monitor v${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: |
           *.ovl
            *.elf
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
