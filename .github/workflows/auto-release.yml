name: Version Release Automation

# ──────────────────────────────────────────────────────────────
# TRIGGERS
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - Makefile
      - "src/**"
      - "include/**"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release even if version unchanged"
        required: false
        default: "false"
        type: boolean
      dry_run:
        description: "Dry run — build & tag, but do NOT publish release"
        required: false
        default: "false"
        type: boolean

# ──────────────────────────────────────────────────────────────
# TOP-LEVEL PERMISSIONS (минимум по умолчанию)
# ──────────────────────────────────────────────────────────────
permissions:
  contents: read

concurrency:
  group: version-release-${{ github.ref }}
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────
# GLOBAL CONSTANTS
# ──────────────────────────────────────────────────────────────
env:
  ARTIFACT_OVL:   "Ryazha-Status-Monitor.ovl"
  RELEASE_PREFIX: "Ryazha-Status-Monitor"
  DEVKITPRO:      "/opt/devkitpro"
  DEVKITA64:      "/opt/devkitpro/devkitA64"

# ══════════════════════════════════════════════════════════════
jobs:

# ──────────────────────────────────────────────────────────────
# JOB 1 — Определяем нужен ли релиз
# ──────────────────────────────────────────────────────────────
  detect-version:
    name: "🔍 Detect Version Change"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      changed:    ${{ steps.check.outputs.changed }}
      version:    ${{ steps.check.outputs.version }}
      tag:        ${{ steps.check.outputs.tag }}
      prev_tag:   ${{ steps.check.outputs.prev_tag }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check version and tag state
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # ── 1. Читаем APP_VERSION из Makefile ─────────────────
          new_version=$(sed -nE \
            's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([0-9]+(\.[0-9]+)*).*/\1/p' \
            Makefile | head -n1)

          if [ -z "$new_version" ]; then
            echo "::error::APP_VERSION not found in Makefile"
            exit 1
          fi

          # ── 2. Мягкая валидация SemVer ────────────────────────
          if ! echo "$new_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::Version '$new_version' is not strict SemVer (X.Y.Z). Proceeding."
          fi

          tag="v${new_version}"
          echo "::notice::Detected version: $new_version  →  tag: $tag"

          # ── 3. Проверяем существование тега на remote ─────────
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tag_exists="true"
            echo "::warning::Tag $tag already exists on remote — release will be skipped"
          else
            tag_exists="false"
          fi

          # ── 4. Ищем предыдущий тег для changelog ──────────────
          prev_tag=$(git tag --list 'v*' \
            --sort=-version:refname \
            | grep -v "^${tag}$" \
            | head -n1 || true)

          # ── 5. Логика нужен ли релиз ──────────────────────────
          changed="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_release }}" = "true" ]; then
              changed="true"
              echo "::notice::Force release requested via workflow_dispatch"
            elif [ "$tag_exists" = "false" ]; then
              changed="true"
            else
              echo "::notice::Tag exists and force_release=false — nothing to do"
            fi
          else
            before="${{ github.event.before }}"
            zero_sha="0000000000000000000000000000000000000000"

            if [ -z "$before" ] || [ "$before" = "$zero_sha" ]; then
              changed="true"
              echo "::notice::First push to branch — treating as new version"
            elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "::warning::Commit $before not found locally — assuming version changed"
              changed="true"
            else
              old_version=$(git show "${before}:Makefile" 2>/dev/null \
                | sed -nE 's/^APP_VERSION[[:space:]]*:?=[[:space:]]*([0-9]+(\.[0-9]+)*).*/\1/p' \
                | head -n1 || true)

              echo "::notice::Old version: '${old_version:-<none>}'  →  New: '$new_version'"

              if [ "${old_version:-}" != "$new_version" ]; then
                changed="true"
              fi
            fi
          fi

          # ── 6. Записываем outputs ─────────────────────────────
          {
            echo "changed=$changed"
            echo "version=$new_version"
            echo "tag=$tag"
            echo "prev_tag=${prev_tag:-}"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

          # ── 7. Job Summary ────────────────────────────────────
          {
            echo "## 🔍 Version Detection"
            echo ""
            echo "| Параметр | Значение |"
            echo "|----------|----------|"
            echo "| Текущая версия | \`$new_version\` |"
            echo "| Тег            | \`$tag\` |"
            echo "| Тег существует | $tag_exists |"
            echo "| Предыдущий тег | \`${prev_tag:-none}\` |"
            echo "| Релиз нужен    | **$changed** |"
            echo "| Триггер        | \`${{ github.event_name }}\` |"
            echo "| force_release  | \`${{ inputs.force_release || 'N/A' }}\` |"
            echo "| dry_run        | \`${{ inputs.dry_run || 'N/A' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

# ──────────────────────────────────────────────────────────────
# JOB 2 — Checkout исходников БЕЗ контейнера
# Решает проблему HTTP 500 при git clone внутри devkit-контейнера
# ──────────────────────────────────────────────────────────────
  prepare-sources:
    name: "📦 Prepare Sources"
    runs-on: ubuntu-latest
    needs: detect-version

    if: |
      needs.detect-version.outputs.changed    == 'true' &&
      needs.detect-version.outputs.tag_exists == 'false'

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Upload sources as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ needs.detect-version.outputs.version }}
          # Исключаем .git и .github — они не нужны для сборки
          path: |
            .
            !.git/**
            !.github/**
          retention-days: 1
          if-no-files-found: error

      - name: Sources summary
        shell: bash
        run: |
          {
            echo "## 📦 Sources"
            echo ""
            echo "| Параметр | Значение |"
            echo "|----------|----------|"
            echo "| Версия  | \`${{ needs.detect-version.outputs.version }}\` |"
            echo "| Коммит  | \`${GITHUB_SHA::8}\` |"
            echo "| Статус  | ✅ uploaded |"
          } >> "$GITHUB_STEP_SUMMARY"

# ──────────────────────────────────────────────────────────────
# JOB 3 — Сборка внутри devkit-контейнера
# Использует download-artifact вместо checkout — нет HTTP 500
# ──────────────────────────────────────────────────────────────
  build:
    name: "🔨 Build ${{ needs.detect-version.outputs.tag }}"
    runs-on: ubuntu-latest
    needs: [detect-version, prepare-sources]

    if: |
      needs.detect-version.outputs.changed    == 'true' &&
      needs.detect-version.outputs.tag_exists == 'false'

    permissions:
      contents: read

    # Фиксированный образ — не сломается при обновлениях
    container:
      image: devkitpro/devkita64:20251231
      options: --user root

    outputs:
      build_time: ${{ steps.build.outputs.build_time }}
      file_size:  ${{ steps.build.outputs.file_size }}

    steps:
      # download-artifact работает через внутренний GitHub API
      # не делает git clone — нет проблем с SSL/сетью в контейнере
      - name: Download sources
        uses: actions/download-artifact@v4
        with:
          name: sources-${{ needs.detect-version.outputs.version }}
          path: .

      # Кэширование объектников — ускоряет повторные сборки
      - name: Cache build objects
        uses: actions/cache@v4
        with:
          path: |
            build/
            .cache/
          key: devkit-build-${{ runner.os }}-${{ hashFiles('Makefile', 'src/**', 'include/**') }}
          restore-keys: |
            devkit-build-${{ runner.os }}-

      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::make output"
          start=$(date +%s)
          make -j"$(nproc)"
          end=$(date +%s)
          build_time=$((end - start))
          echo "::endgroup::"

          ovl="${{ env.ARTIFACT_OVL }}"

          if [ ! -f "$ovl" ]; then
            echo "::error::Artifact '$ovl' not found after make!"
            echo "Files in workspace:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          file_size=$(du -sh "$ovl" | cut -f1)
          echo "::notice::Build OK in ${build_time}s — $ovl (${file_size})"

          {
            echo "build_time=${build_time}s"
            echo "file_size=$file_size"
          } >> "$GITHUB_OUTPUT"

      # Генерируем SHA256 и прикладываем к релизу
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${{ env.ARTIFACT_OVL }}" \
            > "${{ env.ARTIFACT_OVL }}.sha256"
          echo "::notice::$(cat ${{ env.ARTIFACT_OVL }}.sha256)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ needs.detect-version.outputs.version }}
          path: |
            ${{ env.ARTIFACT_OVL }}
            ${{ env.ARTIFACT_OVL }}.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Build summary
        if: always()
        shell: bash
        run: |
          status="${{ job.status }}"
          icon=$( [ "$status" = "success" ] && echo "✅" || echo "❌" )
          {
            echo "## 🔨 Build"
            echo ""
            echo "| Параметр | Значение |"
            echo "|----------|----------|"
            echo "| Артефакт | \`${{ env.ARTIFACT_OVL }}\` |"
            echo "| Размер   | ${{ steps.build.outputs.file_size }} |"
            echo "| Время    | ${{ steps.build.outputs.build_time }} |"
            echo "| Статус   | $icon $status |"
          } >> "$GITHUB_STEP_SUMMARY"

# ──────────────────────────────────────────────────────────────
# JOB 4 — Генерация Release Notes по Conventional Commits
# ──────────────────────────────────────────────────────────────
  generate-release-notes:
    name: "📝 Generate Release Notes"
    runs-on: ubuntu-latest
    needs: [detect-version, build]

    permissions:
      contents: read

    steps:
      - name: Checkout full history for changelog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate categorized release notes
        shell: bash
        env:
          VERSION:  ${{ needs.detect-version.outputs.version }}
          TAG:      ${{ needs.detect-version.outputs.tag }}
          PREV_TAG: ${{ needs.detect-version.outputs.prev_tag }}
        run: |
          set -euo pipefail

          # ── Диапазон коммитов ──────────────────────────────────
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            range="${PREV_TAG}..HEAD"
            prev_display="$PREV_TAG"
            compare_url="${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          else
            range="HEAD"
            prev_display="начало истории"
            compare_url=""
          fi

          # ── Коммиты в формате "HASH|SUBJECT" ──────────────────
          all_commits=$(git log "$range" \
            --pretty=format:"%h|%s" \
            --no-merges 2>/dev/null || true)

          commits_count=$(echo "$all_commits" | grep -c '.' || echo 0)

          # ── Diff stats ─────────────────────────────────────────
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            diff_stats=$(git diff --stat "${PREV_TAG}..HEAD" \
              | tail -n1 2>/dev/null || echo "N/A")
          else
            diff_stats="N/A"
          fi

          # ── Категории Conventional Commits ────────────────────
          declare -a CAT_KEYS=(feat fix perf refactor docs test ci chore other)

          declare -A CAT_TITLE=(
            [feat]="✨ Новые возможности"
            [fix]="🐛 Исправления"
            [perf]="⚡ Производительность"
            [refactor]="♻️ Рефакторинг"
            [docs]="📚 Документация"
            [test]="🧪 Тесты"
            [ci]="👷 CI/CD"
            [chore]="🔧 Прочее"
            [other]="📦 Изменения"
          )

          declare -A CAT_RE=(
            [feat]="^feat(\(.+\))?(!)?:"
            [fix]="^fix(\(.+\))?(!)?:"
            [perf]="^perf(\(.+\))?(!)?:"
            [refactor]="^refactor(\(.+\))?(!)?:"
            [docs]="^docs(\(.+\))?(!)?:"
            [test]="^test(\(.+\))?(!)?:"
            [ci]="^ci(\(.+\))?(!)?:"
            [chore]="^chore(\(.+\))?(!)?:"
          )

          declare -A groups
          for k in "${CAT_KEYS[@]}"; do groups[$k]=""; done

          has_breaking="false"

          # ── Парсим каждый коммит ───────────────────────────────
          while IFS='|' read -r hash subject; do
            [ -z "$hash" ] && continue

            commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${hash}"
            line="- [\`${hash}\`](${commit_url}) ${subject}"

            if echo "$subject" | grep -qE '\w(\(.+\))?!:'; then
              has_breaking="true"
            fi

            matched="false"
            for k in feat fix perf refactor docs test ci chore; do
              if echo "$subject" | grep -qE "${CAT_RE[$k]}"; then
                groups[$k]+="${line}"$'\n'
                matched="true"
                break
              fi
            done

            if [ "$matched" = "false" ]; then
              groups[other]+="${line}"$'\n'
            fi

          done <<< "$all_commits"

          # ── Пишем release-notes.md ─────────────────────────────
          {
            echo "# ${RELEASE_PREFIX} ${VERSION}"
            echo ""
            echo "> 🕐 Автоматический релиз от $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""

            if [ "$has_breaking" = "true" ]; then
              echo "> [!CAUTION]"
              echo "> **⚠️ BREAKING CHANGES** — проверьте совместимость перед обновлением!"
              echo ""
            fi

            echo "## 📋 Журнал изменений"
            echo ""

            any_commits="false"
            for k in "${CAT_KEYS[@]}"; do
              if [ -n "${groups[$k]}" ]; then
                any_commits="true"
                echo "### ${CAT_TITLE[$k]}"
                echo ""
                printf "%s" "${groups[$k]}"
                echo ""
              fi
            done

            if [ "$any_commits" = "false" ]; then
              echo "_Коммиты в этом диапазоне не найдены._"
              echo ""
            fi

            echo "## 📊 Статистика релиза"
            echo ""
            echo "| Параметр | Значение |"
            echo "|----------|----------|"
            echo "| Версия           | \`${VERSION}\` |"
            echo "| Коммитов         | ${commits_count} |"
            echo "| Изменения        | ${diff_stats} |"
            echo "| Коммит           | [\`${GITHUB_SHA::8}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| Предыдущий релиз | \`${prev_display}\` |"
            echo ""

            if [ -n "$compare_url" ]; then
              echo "[📜 Полный список изменений ${prev_display} → ${TAG}](${compare_url})"
              echo ""
            fi

            echo "---"
            echo ""
            echo "_Сгенерировано · [${{ github.workflow }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"

          } > release-notes.md

          echo "::notice::Release notes written ($(wc -l < release-notes.md) lines)"

          echo "::group::release-notes.md preview"
          head -n 25 release-notes.md
          echo "::endgroup::"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ needs.detect-version.outputs.version }}
          path: release-notes.md
          retention-days: 7

      - name: Notes summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 📝 Release Notes"
            echo ""
            echo "| Параметр | Значение |"
            echo "|----------|----------|"
            echo "| Файл   | \`release-notes.md\` |"
            echo "| Строк  | $(wc -l < release-notes.md 2>/dev/null || echo 'N/A') |"
            echo "| Статус | ✅ generated |"
          } >> "$GITHUB_STEP_SUMMARY"

# ──────────────────────────────────────────────────────────────
# JOB 5 — Создание тега и публикация релиза
# ──────────────────────────────────────────────────────────────
  publish-release:
    name: "🚀 Publish ${{ needs.detect-version.outputs.tag }}"
    runs-on: ubuntu-latest
    needs: [detect-version, build, generate-release-notes]

    # write только там где реально нужно
    permissions:
      contents: write

    environment:
      name: release
      url:  ${{ steps.create_release.outputs.url }}

    steps:
      - name: Checkout for git tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ needs.detect-version.outputs.version }}
          path: ./artifacts

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.detect-version.outputs.version }}
          path: ./

      # Проверяем .ovl и .sha256 и верифицируем контрольную сумму
      - name: Verify artifact integrity
        shell: bash
        run: |
          set -euo pipefail

          ovl="./artifacts/${{ env.ARTIFACT_OVL }}"
          sha="./artifacts/${{ env.ARTIFACT_OVL }}.sha256"

          for f in "$ovl" "$sha"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file not found: $f"
              ls -la ./artifacts/ || true
              exit 1
            fi
          done

          (cd ./artifacts && sha256sum -c "${{ env.ARTIFACT_OVL }}.sha256")
          echo "::notice::SHA256 verified OK"
          echo "::notice::$(cat $sha)"

      # Создаём аннотированный git tag с race-condition guard
      - name: Create and push tag
        id: create_tag
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"

          TAG="${{ needs.detect-version.outputs.tag }}"
          VERSION="${{ needs.detect-version.outputs.version }}"

          # Повторная проверка перед пушем — защита от race condition
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG appeared during build (race condition). Aborting."
            exit 1
          fi

          git tag -a "$TAG" \
            -m "Release $VERSION" \
            -m "Commit: ${{ github.sha }}" \
            -m "Run: ${{ github.run_id }}"

          git push origin "$TAG"
          echo "::notice::Tag $TAG pushed successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # dry_run=true — тег создан, но релиз НЕ публикуется
      - name: Create GitHub Release
        id: create_release
        if: ${{ inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.detect-version.outputs.tag }}
          name:       "${{ env.RELEASE_PREFIX }} ${{ needs.detect-version.outputs.tag }}"
          body_path:  release-notes.md
          draft:      false
          # prerelease=true автоматически для версий с дефисом (1.0.0-beta.1)
          prerelease: ${{ contains(needs.detect-version.outputs.version, '-') }}
          files: |
            artifacts/${{ env.ARTIFACT_OVL }}
            artifacts/${{ env.ARTIFACT_OVL }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run notice
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "::notice::DRY RUN — тег создан, релиз НЕ опубликован"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          status="${{ job.status }}"
          icon=$( [ "$status" = "success" ] && echo "✅" || echo "❌" )
          dry="${{ inputs.dry_run || 'false' }}"
          {
            echo "## 🚀 Publish Release"
            echo ""
            echo "| Параметр | Значение |"
            echo "|----------|----------|"
            echo "| Тег      | \`${{ needs.detect-version.outputs.tag }}\` |"
            echo "| Версия   | \`${{ needs.detect-version.outputs.version }}\` |"
            echo "| Dry run  | $dry |"
            echo "| Статус   | $icon $status |"
            if [ -n "${{ steps.create_release.outputs.url }}" ]; then
              echo "| Релиз    | [${{ steps.create_release.outputs.url }}](${{ steps.create_release.outputs.url }}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# ──────────────────────────────────────────────────────────────
# JOB 6 — Итоговый отчёт (выполняется всегда)
# ──────────────────────────────────────────────────────────────
  notify:
    name: "📣 Pipeline Result"
    runs-on: ubuntu-latest
    needs: [detect-version, prepare-sources, build, generate-release-notes, publish-release]

    if: always()

    permissions:
      contents: read

    steps:
      - name: Final pipeline summary
        shell: bash
        run: |
          set -euo pipefail

          r_detect="${{ needs.detect-version.result }}"
          r_prepare="${{ needs.prepare-sources.result }}"
          r_build="${{ needs.build.result }}"
          r_notes="${{ needs.generate-release-notes.result }}"
          r_publish="${{ needs.publish-release.result }}"

          icon() {
            case "$1" in
              success)   echo "✅ success"   ;;
              failure)   echo "❌ failure"   ;;
              skipped)   echo "⏭️ skipped"   ;;
              cancelled) echo "🚫 cancelled" ;;
              *)         echo "❓ $1"        ;;
            esac
          }

          # Итоговый статус
          if [ "$r_publish" = "success" ]; then
            overall="✅ Релиз опубликован успешно"
          elif [ "$r_detect" = "success" ] \
            && [ "${{ needs.detect-version.outputs.changed }}" = "false" ]; then
            overall="ℹ️ Версия не изменилась — релиз пропущен"
          elif [ "${{ needs.detect-version.outputs.tag_exists }}" = "true" ]; then
            overall="⚠️ Тег уже существует — релиз пропущен"
          elif [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            overall="🧪 Dry run — тег создан, релиз не опубликован"
          else
            overall="❌ Пайплайн завершился с ошибкой"
          fi

          echo "Pipeline results:"
          echo "  detect-version:         $r_detect"
          echo "  prepare-sources:        $r_prepare"
          echo "  build:                  $r_build"
          echo "  generate-release-notes: $r_notes"
          echo "  publish-release:        $r_publish"
          echo "  overall:                $overall"

          {
            echo "## 📣 Pipeline Complete"
            echo ""
            echo "| Job | Результат |"
            echo "|-----|-----------|"
            echo "| 🔍 detect-version         | $(icon $r_detect) |"
            echo "| 📦 prepare-sources        | $(icon $r_prepare) |"
            echo "| 🔨 build                  | $(icon $r_build) |"
            echo "| 📝 generate-release-notes | $(icon $r_notes) |"
            echo "| 🚀 publish-release        | $(icon $r_publish) |"
            echo ""
            echo "### $overall"
            echo ""
            echo "| Параметр | Значение |"
            echo "|----------|----------|"
            echo "| Тег     | \`${{ needs.detect-version.outputs.tag }}\` |"
            echo "| Версия  | \`${{ needs.detect-version.outputs.version }}\` |"
            echo "| Коммит  | \`${GITHUB_SHA::8}\` |"
            echo "| Run     | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
