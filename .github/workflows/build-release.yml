name: Build & Release

defaults:
  run:
    shell: bash

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: SMD parser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-tests -DSMD_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build-tests -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  build:
    name: Build
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Build
        run: make -j$(nproc)

      - name: Upload overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryazha-Status-Monitor
          path: Ryazha-Status-Monitor.ovl
          if-no-files-found: error

      # out/ holds the full install layout (switch/.overlays + config with
      # SMD modes and SMSE extensions) — without it the overlay menu is empty.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryazha-Status-Monitor-dist
          path: out/
          if-no-files-found: error

  release:
    name: Publish release if APP_VERSION changed
    needs: [build, tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download overlay artifact
        uses: actions/download-artifact@v4
        with:
          name: Ryazha-Status-Monitor

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: Ryazha-Status-Monitor-dist
          path: dist-out

      - name: Pack full distribution zip
        run: |
          cd dist-out
          zip -r ../Ryazha-Status-Monitor.zip .
          cd ..
          unzip -l Ryazha-Status-Monitor.zip | head -20

      - name: Resolve target tag and check if release exists
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APP_VERSION=$(grep -E '^APP_VERSION\s*:=' Makefile | sed -E 's/.*:=\s*//;s/\s*$//')
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Could not extract APP_VERSION."
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${APP_VERSION}"
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish: $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create & push tag
        if: steps.tag.outputs.should_release == 'true' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name  'ryazhahand-release-bot'
            git config user.email 'ryazhahand-release-bot@users.noreply.github.com'
            git tag -a "$TAG" -m "Auto-release on APP_VERSION change: $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        if: steps.tag.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Ryazha-Status-Monitor ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            Ryazha-Status-Monitor.ovl
            Ryazha-Status-Monitor.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
