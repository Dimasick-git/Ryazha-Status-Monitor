name: Build & Release

defaults:
  run:
    shell: bash

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: SMD parser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        run: cmake -S . -B build-tests -DSMD_BUILD_TESTS=ON -DSMD_WARNINGS_AS_ERRORS=ON

      - name: Build tests
        run: cmake --build build-tests -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  build:
    name: Build
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 # latest at audit time

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Build
        run: make -j$(nproc)

      - name: Upload overlay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ryazha-Status-Monitor
          path: Ryazha-Status-Monitor.ovl
          if-no-files-found: error

      # out/ holds the full install layout (switch/.overlays + config with
      # SMD modes and SMSE extensions) — without it the overlay menu is empty.
      # include-hidden-files is required: upload-artifact v4 silently drops
      # hidden directories like .overlays by default.
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ryazha-Status-Monitor-dist
          path: out/
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Publish release if APP_VERSION changed
    needs: [build, tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download overlay artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Ryazha-Status-Monitor

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Ryazha-Status-Monitor-dist
          path: dist-out

      - name: Pack full distribution zip
        run: |
          cd dist-out
          zip -r ../Ryazha-Status-Monitor.zip .
          cd ..
          unzip -l Ryazha-Status-Monitor.zip | head -20

      - name: Resolve target tag and check if release exists
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APP_VERSION=$(grep -E '^APP_VERSION\s*:=' Makefile | sed -E 's/.*:=\s*//;s/\s*$//')
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Could not extract APP_VERSION."
            exit 1
          fi

          NOTES_FILE="docs/RELEASE_NOTES_${APP_VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release notes not found: $NOTES_FILE"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${APP_VERSION}"
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release exists — re-publish only if an expected asset is missing
            # or implausibly small (a dist zip without the .ovl inside is a
            # few dozen KB), so a broken upload self-heals on the next push.
            ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[] | "\(.name) \(.size)"')
            OVL_OK=$(echo "$ASSETS" | awk '$1 == "Ryazha-Status-Monitor.ovl" {print "yes"}')
            ZIP_OK=$(echo "$ASSETS" | awk '$1 == "Ryazha-Status-Monitor.zip" && $2 > 100000 {print "yes"}')
            if [ "$OVL_OK" = "yes" ] && [ "$ZIP_OK" = "yes" ]; then
              echo "Release $TAG already exists with all assets — skipping."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG exists but assets are incomplete — re-publishing."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Will publish: $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create & push tag
        if: steps.tag.outputs.should_release == 'true' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name  'Dimasick-git'
            git config user.email 'dimaorynchukk@gmail.com'
            git tag -a "$TAG" -m "Auto-release on APP_VERSION change: $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        if: steps.tag.outputs.should_release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Ryazha-Status-Monitor ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.tag.outputs.notes_file }}
          files: |
            Ryazha-Status-Monitor.ovl
            Ryazha-Status-Monitor.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
