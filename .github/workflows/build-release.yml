name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and translations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source and dependencies
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: libryazhahand-deko (private, deploy key)
        env:
          DEKO_KEY: ${{ secrets.LIBRYAZHAHAND_DEKO_KEY }}
        run: |
          command -v ssh >/dev/null 2>&1 || { if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq openssh-client; else sudo apt-get install -y -qq openssh-client; fi; }
          mkdir -p ~/.ssh && printf '%s\n' "$DEKO_KEY" > ~/.ssh/libryazhahand-deko && chmod 600 ~/.ssh/libryazhahand-deko
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global --add safe.directory '*'
          git config --global url."git@github.com:Dimasick-git/libryazhahand-deko".insteadOf "https://github.com/Dimasick-git/libryazhahand-deko"
          git config --global core.sshCommand "ssh -i ~/.ssh/libryazhahand-deko -o IdentitiesOnly=yes"
          git submodule update --init --recursive

      - name: Validate source tree
        run: python3 scripts/validate_source.py

      - name: Verify release tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(sed -nE 's/^APP_VERSION[[:space:]]*:=[[:space:]]*([^[:space:]]+).*$/\1/p' Makefile)
          EXPECTED_TAG="v${APP_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match APP_VERSION $APP_VERSION (expected $EXPECTED_TAG)."
            exit 1
          fi

  build:
    name: Build Nintendo Switch package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout source and dependencies
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: libryazhahand-deko (private, deploy key)
        env:
          DEKO_KEY: ${{ secrets.LIBRYAZHAHAND_DEKO_KEY }}
        run: |
          command -v ssh >/dev/null 2>&1 || { if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq openssh-client; else sudo apt-get install -y -qq openssh-client; fi; }
          mkdir -p ~/.ssh && printf '%s\n' "$DEKO_KEY" > ~/.ssh/libryazhahand-deko && chmod 600 ~/.ssh/libryazhahand-deko
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global --add safe.directory '*'
          git config --global url."git@github.com:Dimasick-git/libryazhahand-deko".insteadOf "https://github.com/Dimasick-git/libryazhahand-deko"
          git config --global core.sshCommand "ssh -i ~/.ssh/libryazhahand-deko -o IdentitiesOnly=yes"
          git submodule update --init --recursive

      - name: Allow Git inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build overlay and distribution
        run: |
          make -j"$(nproc)"
          make dist
          test -s Ryazha-Status-Monitor.ovl
          test -s Ryazha-Status-Monitor.zip
          unzip -t Ryazha-Status-Monitor.zip

      - name: Upload verified build
        uses: actions/upload-artifact@v7
        with:
          name: Ryazha-Status-Monitor-${{ github.sha }}
          path: |
            Ryazha-Status-Monitor.ovl
            Ryazha-Status-Monitor.zip
          if-no-files-found: error

  release:
    name: Publish author-tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: Ryazha-Status-Monitor-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Ryazha-Status-Monitor ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/Ryazha-Status-Monitor.ovl
            release-assets/Ryazha-Status-Monitor.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
