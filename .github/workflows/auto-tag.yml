name: Auto Tag Version

on:
  push:
    branches: [ main ]
    paths:
      - 'Makefile'  # Триггер при изменении Makefile

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract version from Makefile
        id: version
        run: |
          # Извлекаем версию из Makefile
          VERSION=$(grep "APP_VERSION" Makefile | sed 's/APP_VERSION\s*:=\s*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Get last tag
        id: last-tag
        run: |
          # Получаем последний тэг
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          
      - name: Check if version changed
        id: check
        run: |
          # Проверяем, изменилась ли версия
          if [ "${{ steps.version.outputs.version }}" != "${{ steps.last-tag.outputs.last_tag }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Версия изменилась: ${{ steps.last-tag.outputs.last_tag }} -> ${{ steps.version.outputs.version }}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Версия не изменилась: ${{ steps.version.outputs.version }}"
          fi
          
      - name: Create and push tag
        if: steps.check.outputs.changed == 'true'
        run: |
          # Настраиваем git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Создаем тэг
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release version ${{ steps.version.outputs.version }}"
          
          # Пушим тэг
          git push origin "v${{ steps.version.outputs.version }}"
          
          echo "Создан тэг v${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
